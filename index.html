<!DOCTYPE html>
<html lang="zh-TW">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#efe3d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>療癒陶藝工作室</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#e9ddd0}
body{position:fixed;inset:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#5e5048;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;-webkit-appearance:none;appearance:none;border:none;cursor:pointer}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.btn{min-height:42px;border-radius:999px;padding:0 14px;font-size:15px;background:rgba(255,252,247,.92);color:#6d5a4e;box-shadow:0 3px 10px rgba(110,80,60,.16);transition:transform .12s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.94)}
.btn.primary{background:#c98f6b;color:#fff}
.btn.sage{background:#9db39a;color:#fff}
.btn.on{background:#6d5a4e;color:#fff}
.btn:disabled{opacity:.45}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.show{display:block}
#hud .top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);display:flex;align-items:center;gap:8px;padding:0 10px;pointer-events:auto}
.ib{width:42px;height:42px;border-radius:50%;background:rgba(255,252,247,.9);font-size:18px;color:#6d5a4e;box-shadow:0 3px 10px rgba(110,80,60,.16);flex-shrink:0}
.steps{flex:1;display:flex;justify-content:space-between;background:rgba(255,252,247,.82);border-radius:999px;padding:4px;box-shadow:0 3px 10px rgba(110,80,60,.12)}
.steps span{flex:1;text-align:center;font-size:12.5px;padding:6px 0;border-radius:999px;color:#a8968a;white-space:nowrap}
.steps span.done{color:#9db39a}
.steps span.cur{background:#c98f6b;color:#fff;font-weight:600}
.hint{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);background:rgba(255,252,247,.88);color:#7a6355;font-size:13.5px;padding:7px 14px;border-radius:999px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(110,80,60,.12)}
.warn{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 100px);transform:translateX(-50%) scale(.9);background:#e9846f;color:#fff;font-size:14px;padding:7px 16px;border-radius:999px;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;box-shadow:0 4px 14px rgba(200,90,60,.35)}
.warn.show{opacity:1;transform:translateX(-50%) scale(1)}
.meterBox{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 100px);display:none}
.meterBox .ml{font-size:12.5px;color:#7a6355;text-align:center;margin-bottom:4px;text-shadow:0 1px 0 #fff}
.mbar{height:10px;border-radius:9px;background:rgba(255,252,247,.75);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.mbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#e8c39e,#c98f6b);transition:width .15s}
.panel{position:absolute;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(180deg,rgba(239,227,214,0) 0%,rgba(239,227,214,.85) 22%,rgba(239,227,214,.96) 100%);display:none;flex-direction:column;gap:8px;pointer-events:auto}
.panel.show{display:flex}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:nowrap}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tool{height:58px;border-radius:16px;background:rgba(255,252,247,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;color:#7a6355;box-shadow:0 2px 8px rgba(110,80,60,.12)}
.tool .e{font-size:22px;line-height:1.15}
.tool.on{background:#6d5a4e;color:#fff;box-shadow:0 4px 12px rgba(80,60,40,.3)}
.spd{display:flex;align-items:center;gap:8px;font-size:13px;color:#7a6355;flex:1;background:rgba(255,252,247,.92);border-radius:999px;padding:0 14px;height:42px;box-shadow:0 2px 8px rgba(110,80,60,.12)}
.spd b{min-width:34px;text-align:right;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,#e8c39e,#c98f6b);outline:none;touch-action:pan-x}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(80,50,30,.35);border:3px solid #c98f6b}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #c98f6b}
.pal{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;touch-action:pan-x}
.pal::-webkit-scrollbar{display:none}
.chipc{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#7a6355;background:none;min-width:52px}
.chipc i{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.18),0 2px 6px rgba(80,50,30,.2);border:3px solid #fff}
.chipc.on i{border-color:#6d5a4e;transform:scale(1.08)}
.seg{display:flex;background:rgba(255,252,247,.92);border-radius:999px;padding:3px;box-shadow:0 2px 8px rgba(110,80,60,.12)}
.seg button{min-height:36px;padding:0 11px;border-radius:999px;background:none;font-size:13.5px;color:#7a6355}
.seg button.on{background:#6d5a4e;color:#fff}
.kinfo{display:flex;align-items:baseline;justify-content:center;gap:12px;color:#7a6355}
.kinfo b{font-size:30px;color:#c4643f;font-variant-numeric:tabular-nums}
#nameIn{height:46px;border-radius:999px;border:2px solid #e3cdb8;background:#fffaf4;text-align:center;font-size:17px;color:#6d5a4e;font-family:inherit;outline:none;width:100%;-webkit-user-select:text;user-select:text}
/* home */
.overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.overlay.show{display:flex}
#home{justify-content:flex-end;padding:0 18px calc(env(safe-area-inset-bottom) + 28px);background:linear-gradient(180deg,rgba(239,227,214,0) 30%,rgba(239,227,214,.9) 62%,rgba(239,227,214,.98) 100%)}
#home h1{font-size:31px;color:#8a5f47;letter-spacing:3px;margin-bottom:6px;text-shadow:0 2px 0 #fff8f0}
#home p{color:#9b8576;font-size:14.5px;line-height:1.7;text-align:center;margin-bottom:18px}
#home .big{min-height:56px;font-size:18px;width:min(86vw,340px);margin-bottom:10px}
#home .row{width:min(86vw,340px)}
#home .row .btn{flex:1}
.flowline{display:flex;gap:6px;justify-content:center;margin-bottom:18px;font-size:12.5px;color:#a08877;flex-wrap:wrap}
.flowline span{background:rgba(255,252,247,.85);padding:4px 10px;border-radius:999px}
/* gallery */
#gallery{background:linear-gradient(180deg,#f3e9de,#e8dacb);padding-top:calc(env(safe-area-inset-top) + 8px)}
.ghead{width:100%;display:flex;align-items:center;gap:10px;padding:0 12px 10px}
.ghead h2{flex:1;text-align:center;font-size:19px;color:#8a5f47}
.ghead span{width:42px;font-size:12px;color:#a08877;text-align:right}
.shelf{flex:1;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:6px 14px calc(env(safe-area-inset-bottom) + 20px);display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-content:start;touch-action:pan-y}
.gcard{background:#fffaf4;border-radius:20px;padding:8px 8px 10px;box-shadow:0 6px 16px rgba(110,80,60,.14);display:flex;flex-direction:column;gap:4px;color:#6d5a4e;text-align:center;position:relative}
.gcard img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;background:#efe2d4}
.gcard b{font-size:15px}
.gcard span{font-size:11.5px;color:#a08877}
.gcard:after{content:"";position:absolute;left:10%;right:10%;bottom:-8px;height:6px;border-radius:4px;background:#c9a98c;opacity:.6}
.gempty{grid-column:1/-1;text-align:center;color:#a08877;line-height:1.9;padding:50px 10px;font-size:15px}
#viewerHud{position:fixed;left:0;right:0;top:0;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;pointer-events:none}
#viewerHud.show{display:flex}
#viewerHud .ghead{pointer-events:auto;padding:0}
#vName{font-size:26px;color:#8a5f47;margin-top:12px;letter-spacing:2px;text-shadow:0 2px 0 #fff8f0}
#vMeta{font-size:13px;color:#a08877;margin-top:2px}
#vTip{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);font-size:13px;color:#8a7262;background:rgba(255,252,247,.85);padding:6px 14px;border-radius:999px;white-space:nowrap}
#delBtn.armed{background:#e9846f;color:#fff}
/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(80,60,45,.35);display:none;align-items:center;justify-content:center;z-index:50}
#modal.show{display:flex}
#modal .card{background:#fffaf4;border-radius:26px;padding:22px 20px 18px;width:min(86vw,340px);text-align:center;box-shadow:0 14px 40px rgba(80,50,30,.3)}
#modal h3{font-size:21px;color:#8a5f47;margin-bottom:8px}
#modal p{font-size:14.5px;color:#8a7262;line-height:1.7;margin-bottom:16px}
#modal .row{flex-wrap:wrap}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 140px);transform:translate(-50%,-8px);background:rgba(109,90,78,.94);color:#fff;padding:10px 18px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe3d6;color:#a08877;font-size:15px;z-index:99}
#viewCol{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 140px);display:none;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
#viewCol.show{display:flex}
#viewBtn{width:auto;padding:0 12px;border-radius:21px;font-size:14px;font-weight:700}
#viewBtn.on{background:#6d5a4e;color:#fff}
#viewBar{display:none;flex-direction:column;gap:6px}
#viewCol.open #viewBar{display:flex}
#viewBar button{background:rgba(255,252,247,.92);color:#6d5a4e;border-radius:14px;padding:7px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(110,80,60,.15)}
#viewBar button.on{background:#c98f6b;color:#fff}
#viewTip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 230px);transform:translateX(-50%);background:rgba(109,90,78,.82);color:#fff;font-size:13px;padding:6px 14px;border-radius:999px;display:none;white-space:nowrap}
#viewCol.open ~ #viewTip{display:block}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading">陶藝工作室準備中…</div>

<div id="hud">
  <div class="top">
    <button class="ib" id="homeBtn" aria-label="回首頁">‹</button>
    <div class="steps" id="steps"><span data-s="center">定中心</span><span data-s="shape">捏陶土</span><span data-s="kiln">燒製</span><span data-s="glaze">上色</span><span data-s="final">完成</span></div>
    <button class="ib" id="sndBtn" aria-label="音效">🔊</button>
  </div>
  <div id="viewCol"><button class="ib" id="viewBtn">👁 視角</button><div id="viewBar"><button data-v="oblique" class="on">斜上</button><button data-v="side">側面</button><button data-v="top">俯視</button><button data-v="reset">↺ 重設</button></div></div>
  <div id="viewTip">單指拖曳旋轉・雙指縮放・再按 👁 回到捏陶</div>
  <div class="hint" id="hint"></div>
  <div class="warn" id="warn"></div>
  <div class="meterBox" id="meterBox"><div class="ml" id="meterLabel"></div><div class="mbar"><i id="meterFill"></i></div></div>

  <div class="panel" id="pCenter">
    <div class="row"><label class="spd">轉速<input type="range" id="spdC" min="0" max="100" value="70"><b id="spdCv">70%</b></label></div>
  </div>

  <div class="panel" id="pShape">
    <div class="tools" id="tools">
      <button class="tool on" data-tool="finger"><span class="e">👆</span>手指</button>
      <button class="tool" data-tool="open"><span class="e">🫳</span>開孔</button>
      <button class="tool" data-tool="sponge"><span class="e">🧽</span>海綿</button>
      <button class="tool" data-tool="rib"><span class="e">🪵</span>刮板</button>
      <button class="tool" data-tool="wire"><span class="e">〰️</span>割線</button>
    </div>
    <div class="row"><label class="spd">轉速<input type="range" id="spdS" min="0" max="100" value="65"><b id="spdSv">65%</b></label><button class="btn sage" id="waterBtn">💧 加水</button></div>
    <div class="row"><button class="btn" id="guideBtn">參考：無</button><button class="btn" id="undoBtn">↶ 復原</button><button class="btn" id="resetBtn">重來</button><button class="btn primary" id="toKiln">燒製 →</button></div>
  </div>

  <div class="panel" id="pKiln">
    <div class="kinfo"><b id="temp">25°C</b><span id="kstate">把作品放進窯裡</span></div>
    <div class="mbar"><i id="kfill"></i></div>
    <div class="row"><button class="btn primary" id="fireBtn" style="min-height:50px;font-size:16px">🔥 關上窯門・開始素燒</button><button class="btn primary" id="toGlaze" style="min-height:50px;font-size:16px;display:none">🎨 開始上色 →</button></div>
  </div>

  <div class="panel" id="pGlaze">
    <div class="pal" id="pal"></div>
    <div class="row"><div class="seg" id="brushSeg"><button data-b="s">細筆</button><button data-b="m" class="on">中筆</button><button data-b="l">粗筆</button></div><div class="seg" id="sideSeg"><button data-side="out" class="on">外側</button><button data-side="in">內側</button></div></div>
    <div class="row"><div class="seg" id="finSeg"><button data-f="gloss" class="on">亮面</button><button data-f="matte">霧面</button><button data-f="speckle">斑點</button><button data-f="gradient">漸層</button></div></div>
    <div class="row"><button class="btn" id="dipFull">🫙 浸釉・全</button><button class="btn" id="dipHalf">浸釉・半</button><button class="btn" id="clearGlaze">洗掉</button></div>
    <div class="row"><label class="spd">轉速<input type="range" id="spdG" min="0" max="100" value="45"><b id="spdGv">45%</b></label><button class="btn primary" id="finishBtn">✨ 完成上色</button></div>
  </div>

  <div class="panel" id="pFinal">
    <input id="nameIn" maxlength="16" placeholder="幫作品取個名字">
    <div class="row"><button class="btn primary" id="saveBtn">🗄️ 存到展示櫃</button><button class="btn" id="againBtn">再做一個</button><button class="btn" id="galBtn2">展示櫃</button></div>
  </div>
</div>

<section class="overlay" id="home">
  <h1>療癒陶藝工作室</h1>
  <p>轉盤輕輕轉，雙手沾點水<br>慢慢把一團陶土，捏成屬於你的器皿</p>
  <div class="flowline"><span>① 定中心</span><span>② 捏陶土</span><span>③ 燒製</span><span>④ 上色</span><span>⑤ 展示</span></div>
  <button class="btn primary big" id="startBtn">🏺 開始捏陶</button>
  <div class="row"><button class="btn" id="galBtn">🗄️ 展示櫃</button><button class="btn" id="sndBtn2">🔊 音效：開</button></div>
</section>

<section class="overlay" id="gallery">
  <div class="ghead"><button class="ib" id="galBack">‹</button><h2>🗄️ 我的展示櫃</h2><span id="galCount"></span></div>
  <div class="shelf" id="shelf"></div>
</section>

<div id="viewerHud">
  <div class="ghead" style="width:100%"><button class="ib" id="vBack">‹</button><h2 style="font-size:15px;color:#a08877">展示櫃</h2><button class="btn" id="delBtn">🗑️ 刪除</button></div>
  <div id="vName"></div><div id="vMeta"></div>
  <div id="vTip">👆 拖曳旋轉・雙指縮放</div>
</div>

<div id="modal"><div class="card"><h3 id="mTitle"></h3><p id="mText"></p><div class="row" id="mBtns"></div></div></div>
<div id="toast"></div>
